  <nav class="appbar" aria-label="하단 메뉴">

<script>
  // 시작 애니메이션: 물 차오름 · 0→80 카운트 · 문구 타이핑 · 카드 순차 등장
  (function () {
    var num = document.querySelector('.score-num');
    var typed = document.querySelector('.pill .typed');
    var target = num ? +num.dataset.target : 0;
    var chars = typed ? Array.from(typed.textContent) : [];
    if (num) num.textContent = '0';
    if (typed) typed.textContent = '';

    var run = 0; // 실행 번호: 다시 재생하면 이전 타이핑·카운트를 멈춤
    function play() {
      var my = ++run, root = document.documentElement;
      root.classList.remove('play');
      void root.offsetWidth; // CSS 애니메이션을 처음부터 다시 시작
      root.classList.add('play');
      if (num) countUp(my);
      if (typed) typeQuote(my);
    }
    function countUp(my) { // 물 차오름과 같은 0.5s 지연, 1.6s 길이로 0 → 80
      var delay = 500, dur = 1600, t0 = null;
      function ease(t) { return 1 - Math.pow(1 - t, 3); }
      num.textContent = '0';
      function step(ts) {
        if (my !== run) return;
        if (t0 === null) t0 = ts;
        var t = Math.min(Math.max((ts - t0 - delay) / dur, 0), 1);
        num.textContent = Math.round(target * ease(t));
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    function typeQuote(my) { // 문구 박스가 나타난 뒤 한 글자씩
      var i = 0;
      typed.textContent = '';
      setTimeout(function tick() {
        if (my !== run) return;
        typed.textContent = chars.slice(0, ++i).join('');
        if (i < chars.length) setTimeout(tick, chars[i - 1] === ' ' ? 40 : 75);
      }, 750);
    }
    // 항상 바로 시작한다 (일부 앱 내 브라우저는 화면에 보여도 hidden으로 알려주므로 기다리지 않음).
    // 백그라운드 탭에서 열려 안 보이는 사이 끝났다면, 처음 보이는 순간 한 번 더 재생.
    var hiddenAtLoad = document.visibilityState === 'hidden';
    play();
    if (hiddenAtLoad) {
      document.addEventListener('visibilitychange', function once() {
        if (document.visibilityState !== 'visible') return;
        document.removeEventListener('visibilitychange', once);
        play();
      });
    }
  })();

  // 주제별 운세 칩: 마우스 드래그 · 휠로도 가로 스크롤 (터치는 기본 스크롤)
  (function () {
    var row = document.querySelector('.chips');
    if (!row) return;
    var startX = 0, startLeft = 0, down = false, moved = false;
    row.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'mouse') return;
      down = true; moved = false; startX = e.clientX; startLeft = row.scrollLeft;
    });
    window.addEventListener('pointermove', function (e) {
      if (!down) return;
      var dx = e.clientX - startX;
      if (!moved && Math.abs(dx) > 4) { moved = true; row.classList.add('dragging'); }
      if (moved) row.scrollLeft = startLeft - dx;
    });
    window.addEventListener('pointerup', function () {
      if (!down) return;
      down = false;
      setTimeout(function () { row.classList.remove('dragging'); }, 0);
    });
    row.addEventListener('click', function (e) { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
    row.addEventListener('wheel', function (e) {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; // 트랙패드 가로 스와이프는 그대로
      var max = row.scrollWidth - row.clientWidth;
      var next = row.scrollLeft + e.deltaY;
      if ((e.deltaY < 0 && row.scrollLeft <= 0) || (e.deltaY > 0 && row.scrollLeft >= max)) return; // 끝에선 페이지 스크롤
      e.preventDefault();
      row.scrollLeft = Math.min(Math.max(next, 0), max);
    }, { passive: false });
  })();

  // 하단 탭: 선택 상태 전환
  document.querySelectorAll('.appbar .tab').forEach(function (tab) {
    tab.addEventListener('click', function (e) {
      e.preventDefault();
      document.querySelectorAll('.appbar .tab').forEach(function (t) { t.removeAttribute('aria-current'); });
      tab.setAttribute('aria-current', 'page');
    });
  });
</script>
